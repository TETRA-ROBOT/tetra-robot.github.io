# site/ 폴더(랜딩 페이지 + 미리 빌드한 데모 2개)를 GitHub Pages 로 올린다.
# 데모 빌드 결과는 커밋해 둔다 (scripts/update_demos.sh 또는 update-demos.yml 이 만든다).
# update-demos.yml 이 커밋한 뒤에는 이 워크플로를 workflow_call 로 부른다 (Actions 토큰으로 한 push 는 다른 워크플로를 깨우지 않으므로).
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # workflow_call 때도 방금 커밋한 최신 main 을 올린다
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
