# site/ 폴더(랜딩 페이지 + 미리 빌드한 데모 2개)를 GitHub Pages 로 올린다.
# 데모는 비공개 저장소의 화면 코드를 빌드한 결과라서, CI 에서 빌드하지 않고 scripts/build_all.sh 로 만든 결과를 커밋한다.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
