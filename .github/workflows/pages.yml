# site/ 폴더(랜딩 페이지 + 미리 빌드한 데모 2개)를 GitHub Pages 로 올린다.
# 데모 빌드 결과는 커밋해 둔다 (scripts/update_demos.sh 또는 update-demos.yml 이 만든다).
# update-demos.yml 이 커밋한 뒤에는 이 워크플로를 workflow_call 로 부른다 (Actions 토큰으로 한 push 는 다른 워크플로를 깨우지 않으므로).
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # 올리기와 배포를 다른 작업으로 나눈다 (GitHub 기본 틀과 같음). 한 작업 안에서 올리자마자 배포하면
  # deploy-pages 가 방금 올린 결과물을 못 찾는 일("No artifacts named github-pages")이 가끔 있었다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # workflow_call 때도 방금 커밋한 최신 main 을 올린다
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # 그래도 못 찾으면 잠깐 기다렸다 한 번 더 (결과물 목록이 늦게 보이는 경우)
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
