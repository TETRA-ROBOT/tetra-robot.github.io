<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="./favicon.ico">
    <meta name="theme-color" content="#00BFB4">
    <meta name="robots" content="noindex">
    <title>TETRA 로봇 관제 (데모)</title>
    <script>
      (function() {
        try {
          var mode = 'system';
          var raw = localStorage.getItem('tetra-ui-monitor');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.theme_mode) mode = parsed.theme_mode;
          }
          var resolved = mode;
          if (mode === 'system') {
            resolved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <noscript><strong>이 데모는 JavaScript 가 필요합니다.</strong></noscript>
    <div id="app"></div>
    <script type="module" src="./demo-main.ts"></script>
  </body>
</html>
